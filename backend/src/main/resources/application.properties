server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:gymsystemdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:gymsystem-super-secret-key-change-in-production-32chars}
app.jwt.expiration-ms=86400000

app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# Nombre del gimnasio (configurable por cliente)
app.gym.name=${GYM_NAME:Gym System}
app.gym.subtitle=${GYM_SUBTITLE:Administracion}
